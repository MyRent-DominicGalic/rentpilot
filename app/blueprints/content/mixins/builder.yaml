uuid: 78650dea-607e-4c63-bde8-2364cb786072
handle: Content\Builder
type: mixin
name: Builder

fields:
  builder:
    type: repeater
    label: Builder
    displayMode: builder
    span: adaptive
    prompt: Add a Block
    groups:
      hero:
        name: Hero
        icon: icon-laptop
        description: A hero section with a background image.
        titleFrom: title
        useTabs: true
        fields:
          above_title:
            label: Above Title
            type: text
            commentAbove: It filled displays above title
            span: left
            tab: General
          title_html_tag:
            type: dropdown
            label: Title HTML Tag type
            commentAbove: Override this title html tag to one of the options below.
            span: right
            tab: General
            options:
              h1: 'h1'
              h2: 'h2'
              h3: 'h3'
          content_fields:
            type: mixin
            source: Content\Content
            commentAbove: Content Fields
          advanced_fields:
            type: mixin
            source: Content\AdvancedFields
            commentAbove: Advanced Fields
      card_slider:
        name: Card Slider
        icon: icon-laptop
        description: A section with card slider
        titleFrom: title
        useTabs: true
        fields:
          title:
            label: Title
            type: text
            commentAbove: Only for organizational purposes
            tab: General
            span: auto
          layout:
            type: dropdown
            label: Layout
            commentAbove: Change the layout of this slider.
            span: auto
            tab: General
            default: value[simple]
            options:
              simple: Simple
              overflow: Simple overflow
              grid: Grid
              dynamic: Dynamic with nav
          items:
            type: repeater
            label: Slides
            displayMode: builder
            commentAbove: Add slide to show on slider.
            span: full
            tab: General
            maxItems: 16
            showDuplicate: true
            showReorder: true
            prompt: Add an slide
            form:
              fields:
                item:
                  label: Post
                  type: entries
                  maxItems: 1
                  hidden: 1
                  source: Blog\Post
                  trigger:
                    action: hide
                    field: is_custom
                    condition: checked
                is_custom:
                  label: 'Custom Slide'
                  type: switch
                  span: auto
                  column: false
                  default: 1
                  scope: false
                item_custom:
                  type: mixin
                  source: Content\Content
                  trigger:
                    action: disable|hide
                    field: is_custom
                    condition: unchecked
          advanced_fields:
            type: mixin
            source: Content\AdvancedFields
            commentAbove: Advanced Fields
      nav_icons:
        name: Icons nav
        icon: icon-laptop
        description: A list of icons for navigation
        titleFrom: title
        useTabs: true
        fields:
          title:
            label: Title
            type: text
            commentAbove: Only for organizational purposes
            tab: General
            span: auto
          single_row:
            label: 'Single row icons'
            type: switch
            span: auto
            tab: General
            column: false
            default: 0
            scope: false
          items:
            type: repeater
            label: Icons
            displayMode: builder
            commentAbove: Add icon.
            span: full
            tab: General
            maxItems: 16
            showDuplicate: true
            showReorder: true
            prompt: Add an Icon
            titleFrom: title
            form:
              fields:
                title:
                  label: Title
                  type: text
                  span: auto
                icon:
                  label: Icon
                  type: text
                  span: auto
                page:
                  type: pagefinder
                  label: Page
                  singleMode: true
                  span: left
          advanced_fields:
            type: mixin
            source: Content\AdvancedFields
            commentAbove: Advanced Fields
      header_section:
        name: Header section
        icon: icon-laptop
        description: A section with heading
        titleFrom: title
        useTabs: true
        fields:
          above_title:
            label: Above Title
            type: text
            span: full
            tab: General
          title:
            label: Title
            commentAbove: Title of this section
            type: text
            span: auto
            tab: General
          title_html_tag:
            type: dropdown
            label: Title HTML Tag type
            commentAbove: Override this title html tag to one of the options below.
            span: right
            tab: General
            options:
              h2: 'h2'
              h1: 'h1'
              h3: 'h3'
          sub_title:
            label: Sub Title
            type: richeditor
            span: full
            size: small
            tab: General
          advanced_fields:
            type: mixin
            source: Content\AdvancedFields
            commentAbove: Advanced Fields
      content_section:
        name: Content section
        icon: icon-laptop
        description: A section with content
        titleFrom: title
        useTabs: true
        fields:
          content_rich_fields:
            type: mixin
            source: Content\ContentRich
            commentAbove: Content Fields
          advanced_fields:
            type: mixin
            source: Content\AdvancedFields
            commentAbove: Advanced Fields
      content_list:
        name: Content list
        icon: icon-laptop
        description: Contect List
        titleFrom: title
        useTabs: true
        fields:
          title:
            label: Title
            type: text
            commentAbove: Only for organizational purposes
            tab: General
            span: auto
          use_numbers:
            label: 'Use arrow'
            type: switch
            default: 0
            span: right
            comment: Use arrow with numbering
            tab: General
          arrow_center:
            label: 'Arrow center'
            type: switch
            default: 0
            span: right
            comment: Put arrow on center
            tab: General
          use_zigzag:
            label: 'ZigZag background'
            type: switch
            default: 0
            span: right
            comment: Use alternating background color
            tab: General
          sections:
            type: repeater
            label: Sections
            displayMode: builder
            commentAbove: Add an section
            span: full
            tab: General
            maxItems: 16
            showDuplicate: true
            showReorder: true
            prompt: Add an section
            titleFrom: title
            form:
              fields:
                content_rich_fields:
                  type: mixin
                  source: Content\ContentRich
                  commentAbove: Content Fields
                image_code:
                    label: Image code
                    type: codeeditor
                    size: small
                    language: html
          advanced_fields:
            type: mixin
            source: Content\AdvancedFields
            commentAbove: Advanced Fields
      icons_list:
        name: Icons list
        icon: icon-laptop
        description: A list of icons
        titleFrom: title
        useTabs: true
        fields:
          title:
            label: Title
            type: text
            commentAbove: Only for organizational purposes
            tab: General
            span: auto
          icons:
            type: repeater
            label: Icons
            displayMode: builder
            commentAbove: Add an icon
            span: full
            tab: General
            maxItems: 16
            showDuplicate: true
            showReorder: true
            prompt: Add an icon
            titleFrom: title
            form:
              fields:
                title:
                  label: Title
                  type: text
                  span: auto
                icon:
                  label: Icon
                  type: text
                  span: auto
                content:
                  label: Answer
                  type: text
                  span: full
          advanced_fields:
            type: mixin
            source: Content\AdvancedFields
            commentAbove: Advanced Fields
      images_list:
        name: Images list
        icon: icon-laptop
        description: A list of images
        titleFrom: title
        useTabs: true
        fields:
          title:
            label: Title
            type: text
            commentAbove: Only for organizational purposes
            tab: General
            span: auto
          images:
            type: repeater
            label: Images
            displayMode: builder
            commentAbove: Add an image
            span: full
            tab: General
            maxItems: 16
            showDuplicate: true
            showReorder: true
            prompt: Add an image
            titleFrom: title
            form:
              fields:
                title:
                  label: Title
                  type: text
                  span: full
                image:
                  label: Image
                  type: mediafinder
                  commentAbove: Image of this section
                  span: auto
                  mode: image
                  maxItems: 1
                  tab: General
                page:
                  type: pagefinder
                  label: Page
                  commentAbove: Link to when click on image
                  singleMode: true
                  span: auto
          advanced_fields:
            type: mixin
            source: Content\AdvancedFields
            commentAbove: Advanced Fields
      boxes_list:
        name: Boxes list
        icon: icon-laptop
        description: A list of boxes
        titleFrom: title
        useTabs: true
        fields:
          title:
            label: Title
            type: text
            commentAbove: Only for organizational purposes
            tab: General
            span: auto
          boxes:
            type: repeater
            label: Boxes
            displayMode: builder
            commentAbove: Add an box
            span: full
            tab: General
            maxItems: 16
            showDuplicate: true
            showReorder: true
            prompt: Add an box
            titleFrom: title
            form:
              fields:
                above_title:
                  label: Above Title
                  type: text
                  span: full
                title:
                  label: Title
                  type: text
                  span: auto
                icon:
                  label: Icon
                  type: text
                  span: auto
                url:
                  type: pagefinder
                  label: Box link
                  singleMode: true
                  span: auto
                content:
                  label: Content
                  type: richeditor
                  commentAbove: Text content of this section
                  span: full
                  size: small
                  tab: General
          connect_boxes:
            label: 'Connect Boxes'
            type: switch
            default: 0
            span: auto
            comment: Connect boxes with arrows
            tab: General
          advanced_fields:
            type: mixin
            source: Content\AdvancedFields
            commentAbove: Advanced Fields
      reviews_list:
        name: Reviews list
        icon: icon-laptop
        description: A list of reviews
        titleFrom: title
        useTabs: true
        fields:
          title:
            label: Title
            type: text
            commentAbove: Only for organizational purposes
            tab: General
            span: auto
          reviews:
            type: repeater
            label: Reviews
            displayMode: builder
            commentAbove: Add an review
            span: full
            tab: General
            maxItems: 12
            showDuplicate: true
            showReorder: true
            prompt: Add an review
            titleFrom: title
            form:
              fields:
                author:
                  label: Author
                  type: text
                  span: auto
                url:
                  type: pagefinder
                  label: Review link
                  singleMode: true
                  span: auto
                company:
                  label: Company
                  type: text
                  span: auto
                logo:
                  label: Logo
                  type: mediafinder
                  span: auto
                  mode: image
                  maxItems: 1
                  tab: General
                content:
                  label: Content
                  type: textarea
                  span: full
                  size: small
                  tab: General
          advanced_fields:
            type: mixin
            source: Content\AdvancedFields
            commentAbove: Advanced Fields
      posts:
        name: Posts
        icon: icon-newspaper-o
        description: Section with blog posts.
        titleFrom: title
        useTabs: true
        fields:
          posts:
            type: mixin
            source: Content\Posts
            tab: General
          advanced_fields:
            type: mixin
            source: Content\AdvancedFields
            commentAbove: Advanced Fields
      form:
        name: Form
        icon: icon-list-alt
        description: Section with a form.
        titleFrom: title
        useTabs: true
        fields:
          title:
            label: Title
            type: text
            commentAbove: Only for organizational purposes
            tab: General
            span: auto
          form:
            type: mixin
            source: Content\Form
      